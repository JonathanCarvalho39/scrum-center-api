name: CI/CD — Deploy em Produção (agilflow.duckdns.org)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: jonathancarvalho39/scrum-center-api
  FRONTEND_IMAGE: jonathancarvalho39/scrum-center-view
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ubuntu
  DEPLOY_DIR: /opt/agilflow

jobs:
  # ─────────────────────────────────
  # 1. TEST
  # ─────────────────────────────────
  test:
    name: Testes Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run tests
        run: go test ./... -v -race -timeout 60s

  # ─────────────────────────────────
  # 2. BUILD BACKEND
  # ─────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export tar for Trivy
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          docker save ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest -o /tmp/backend.tar

      - uses: actions/upload-artifact@v4
        with:
          name: backend-tar
          path: /tmp/backend.tar
          retention-days: 1

  # ─────────────────────────────────
  # 3. TRIVY SCAN
  # ─────────────────────────────────
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-tar
          path: /tmp

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/backend.tar
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  # ─────────────────────────────────
  # 4. DEPLOY PARA EC2
  # ─────────────────────────────────
  deploy:
    name: Deploy → EC2 (44.202.52.62)
    runs-on: ubuntu-latest
    needs: trivy-scan
    environment:
      name: production
      url: http://agilflow.duckdns.org/api/health
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy docker-compose to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.yml

      - name: Copy nginx config to EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ${{ env.DEPLOY_DIR }}/nginx/conf.d ${{ env.DEPLOY_DIR }}/nginx/ssl"

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} << 'DEPLOY'
          set -e

          cd ${{ env.DEPLOY_DIR }}

          # Write .env (secrets never logged)
          cat > .env << 'ENV'
          DB_USER=postgres
          DB_NAME=scrum_center
          GIN_MODE=release
          JWT_EXPIRATION_HOURS=1
          REFRESH_TOKEN_EXPIRATION_HOURS=168
          ALLOWED_ORIGINS=https://agilflow.duckdns.org
          BACKEND_IMAGE=jonathancarvalho39/scrum-center-api:latest
          FRONTEND_IMAGE=jonathancarvalho39/scrum-center-view:latest
          ENV

          # Append secrets
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

          # Pull latest images
          docker compose pull

          # Zero-downtime restart
          docker compose up -d --remove-orphans

          echo "✅ Deploy completed: $(date)"
          DEPLOY

      - name: Health check backend
        run: |
          echo "Aguardando backend inicializar..."
          sleep 30

          for i in {1..5}; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:8080/health || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Backend health check PASSED (HTTP $HTTP)"
              break
            fi
            echo "Tentativa $i/5: HTTP $HTTP — aguardando 15s..."
            sleep 15
          done

          if [ "$HTTP" != "200" ]; then
            echo "❌ Backend health check FAILED"
            exit 1
          fi

      - name: Health check nginx/frontend
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/ || echo "000")
          echo "Frontend HTTP: $HTTP"
          if [ "$HTTP" = "200" ] || [ "$HTTP" = "301" ] || [ "$HTTP" = "302" ]; then
            echo "✅ Frontend health check PASSED"
          else
            echo "⚠️ Frontend HTTP $HTTP (pode ainda estar iniciando)"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deploy summary
        if: success()
        run: |
          echo "✅ Deploy em produção concluído com sucesso"
          echo "🌐 URL: http://agilflow.duckdns.org"
          echo "🔍 API: http://agilflow.duckdns.org/api/health"
          echo "🕐 Timestamp: $(date)"
