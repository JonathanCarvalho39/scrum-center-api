name: Deploy to VM

on:
  # Roda automaticamente após Docker Build passar
  workflow_run:
    workflows: ["Docker Build & Push"]
    types:
      - completed
    branches: [main]
  # Permite execução manual
  workflow_dispatch:

env:
  DEPLOY_DIR: /opt/scrum-center-api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to Production VM
    runs-on: ubuntu-latest
    # Só roda se Docker passou OU for execução manual
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create deployment directory
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            "sudo mkdir -p ${{ env.DEPLOY_DIR }} && sudo chown ubuntu:ubuntu ${{ env.DEPLOY_DIR }}"

      - name: Copy docker-compose
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            ubuntu@${{ secrets.EC2_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.yml

      - name: Copy nginx configuration
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            "mkdir -p ${{ env.DEPLOY_DIR }}/nginx/conf.d ${{ env.DEPLOY_DIR }}/nginx/ssl"
          
          scp -i ~/.ssh/deploy_key -r \
            nginx/nginx.conf \
            nginx/conf.d/ \
            ubuntu@${{ secrets.EC2_HOST }}:${{ env.DEPLOY_DIR }}/nginx/

      - name: Copy SSL setup scripts
        run: |
          scp -i ~/.ssh/deploy_key \
            setup-ssl.sh \
            setup-ssl-renew.sh \
            ubuntu@${{ secrets.EC2_HOST }}:${{ env.DEPLOY_DIR }}/
          
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            "chmod +x ${{ env.DEPLOY_DIR }}/setup-ssl.sh ${{ env.DEPLOY_DIR }}/setup-ssl-renew.sh"

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} << 'DEPLOY'
          set -e
          
          # Check if Docker is installed
          if ! command -v docker &> /dev/null; then
            echo "Docker not found. Installing..."
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc
            
            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
              $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            
            # Add user to docker group
            sudo usermod -aG docker ubuntu
            echo "Docker installed successfully. Please re-run the deployment."
            exit 0
          fi
          
          cd ${{ env.DEPLOY_DIR }}

          # Create .env file
          cat > .env << 'ENV'
          PORT=8080
          GIN_MODE=release
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=postgres
          DB_NAME=scrum_center
          DB_SSLMODE=disable
          ALLOWED_ORIGINS=http://scrumcenter.duckdns.org,https://scrumcenter.duckdns.org
          ENVIRONMENT=production
          ENV

          # Add secrets
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "BACKEND_IMAGE=ghcr.io/jonathancarvalho39/scrum-center-api:latest" >> .env

          # Pull latest image from GHCR
          docker pull ghcr.io/jonathancarvalho39/scrum-center-api:latest

          # Deploy with zero downtime
          docker compose up -d --remove-orphans

          echo "✅ Deploy completed at $(date)"
          DEPLOY

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 20

          for i in {1..5}; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/health || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Health check PASSED (HTTP $HTTP)"
              exit 0
            fi
            echo "Attempt $i/5: HTTP $HTTP - waiting 10s..."
            sleep 10
          done

          echo "❌ Health check FAILED"
          exit 1

      - name: Update DuckDNS
        if: success()
        run: |
          RESPONSE=$(curl -s "https://www.duckdns.org/update?domains=scrumcenter&token=${{ secrets.TOKEN_DNS }}&ip=")
          if [ "$RESPONSE" = "OK" ]; then
            echo "✅ DuckDNS updated"
          else
            echo "⚠️ DuckDNS update failed (non-critical): $RESPONSE"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

