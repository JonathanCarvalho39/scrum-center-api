upstream api_backend {
    server api:8080;
}

# Default server (aceita requisições por IP - para health checks)
server {
    listen 80 default_server;
    server_name _;

    location /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Bloqueia outras requisições que não sejam /health
    location / {
        return 444;
    }
}

# HTTP Server para o domínio (ANTES de configurar SSL)
# Depois de configurar SSL, este bloco será comentado automaticamente
server {
    listen 80;
    server_name scrumcenter.duckdns.org;

    # Health check endpoint
    location /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # API endpoints
    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

