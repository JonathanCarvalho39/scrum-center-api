run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck      # Verifica erros não tratados
    - gosimple      # Simplificações de código
    - govet         # Análise estática padrão
    - ineffassign   # Detecta atribuições ineficientes
    - staticcheck   # Verificações estáticas avançadas
    - typecheck     # Verificação de tipos
    - unused        # Detecta código não usado
    - gofmt         # Verifica formatação
    - goimports     # Verifica imports
    - gosec         # Verifica problemas de segurança

  disable:
    - misspell      # Muito restritivo
    - revive        # Warnings de documentação (muito verboso)
    - bodyclose     # Não aplicável ainda
    - noctx         # Não aplicável ainda
    - gocritic      # Muito restritivo
    - godot         # Comentários com ponto (muito restritivo)
    - gocyclo       # Complexidade (não prioritário)
    - dupl          # Duplicação (não prioritário)
    - prealloc      # Pre-alocação (otimizaç��o prematura)
    - unconvert     # Conversões (não prioritário)

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable:
      - shadow


issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Permite não checar erros em setup de testes
    - path: _test\.go
      linters:
        - errcheck
        - gosec

